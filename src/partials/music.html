<!-- music: Spotify embed (works without Premium) + local files -->
<div class="overlay parked" id="muOv">
  <div class="sheet" role="dialog" aria-labelledby="muTitle">
    <h2 id="muTitle">音樂</h2>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabSp" aria-selected="true">Spotify</button>
      <button role="tab" id="tabLo" aria-selected="false">手機裡的音樂</button>
    </div>
    <div id="paneSp" class="pane">
      <div class="account" id="spAccount"></div>
      <div class="lists" id="spLists" hidden></div>
      <details class="paste" id="spPaste">
        <summary>或貼上歌單分享連結</summary>
        <div class="inline"><input class="txt" id="spUrl" placeholder="https://open.spotify.com/playlist/…" inputmode="url"><button class="btn primary" id="spLoad">載入</button></div>
      </details>
      <div class="embed" id="spBox"><div class="empty" id="spEmpty">選一個歌單就會出現在這裡</div><div id="spEmbed"></div></div>
      <p class="note">在這裡播放時，瀏覽器沒登入 Spotify 只能聽 30 秒試聽（iPhone 常見）。想聽完整歌曲，按「在 Spotify App 播放」，音效會直接疊在音樂上，不會把它停掉。</p>
      <div class="actions" style="justify-content:flex-start">
        <a class="btn" id="spOpen" href="https://open.spotify.com" target="_blank" rel="noopener">在 Spotify App 播放</a>
      </div>
    </div>
    <div id="paneLo" class="pane" hidden>
      <p>從手機或平板選幾首歌，免帳號、可離線播放，音效響起時會自動把音量壓低。</p>
      <div class="actions" style="justify-content:flex-start">
        <span class="btn filebtn">＋ 選擇音樂檔<input type="file" id="loFiles" accept="audio/*" multiple aria-label="選擇音樂檔"></span>
      </div>
      <div class="tracks" id="loList"></div>
      <div class="player">
        <button class="btn" id="loPrev" aria-label="上一首">⏮</button>
        <button class="btn primary" id="loPlay" aria-label="播放或暫停">▶</button>
        <button class="btn" id="loNext" aria-label="下一首">⏭</button>
        <input type="range" id="loVol" min="0" max="100" value="80" aria-label="音量">
      </div>
    </div>
    <p class="note">音效一律疊在音樂上播放。iPhone 要關閉靜音模式才聽得到音效。</p>
    <div class="actions"><button class="btn" id="muClose">關閉（音樂繼續播）</button></div>
  </div>
</div>
